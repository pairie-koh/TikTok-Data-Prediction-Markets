<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Prediction Market Transcripts</title>
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #333;
    --text: #e8e8e8;
    --text-dim: #888;
    --accent: #fe2c55;
    --accent-hover: #ff4d6f;
    --blue: #5b9bd5;
    --green: #4caf50;
    --tag-bg: #2a2a2a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  header h1 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 12px;
  }

  header h1 span { color: var(--accent); }

  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  .search-box {
    flex: 1;
    min-width: 220px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 14px;
    outline: none;
  }

  .search-box:focus { border-color: var(--accent); }

  .filter-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .filter-btn:hover { border-color: var(--text-dim); color: var(--text); }
  .filter-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(254,44,85,0.1); }

  .stats {
    font-size: 13px;
    color: var(--text-dim);
    padding: 0 4px;
  }

  .layout {
    display: flex;
    height: calc(100vh - 80px);
  }

  .list-panel {
    width: 420px;
    min-width: 320px;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    flex-shrink: 0;
  }

  .video-card {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.1s;
  }

  .video-card:hover { background: var(--surface2); }
  .video-card.selected { background: var(--surface2); border-left: 3px solid var(--accent); }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }

  .card-username {
    font-weight: 600;
    font-size: 14px;
    color: var(--text);
  }

  .card-date {
    font-size: 12px;
    color: var(--text-dim);
  }

  .card-desc {
    font-size: 13px;
    color: var(--text-dim);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 6px;
  }

  .card-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--tag-bg);
    color: var(--text-dim);
  }

  .tag.transcript { color: var(--green); border: 1px solid rgba(76,175,80,0.3); }
  .tag.coded { color: var(--blue); border: 1px solid rgba(91,155,213,0.3); }
  .tag.market { color: var(--accent); border: 1px solid rgba(254,44,85,0.3); }

  .card-stats {
    display: flex;
    gap: 12px;
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 6px;
  }

  .detail-panel {
    flex: 1;
    overflow-y: auto;
    padding: 28px 32px;
  }

  .detail-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-dim);
    font-size: 15px;
  }

  .detail-header { margin-bottom: 20px; }

  .detail-username {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .detail-date { color: var(--text-dim); font-size: 14px; }

  .detail-link {
    display: inline-block;
    margin-top: 12px;
    padding: 8px 20px;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: background 0.15s;
  }

  .detail-link:hover { background: var(--accent-hover); }

  .detail-section {
    margin-top: 24px;
  }

  .detail-section h3 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .detail-description {
    font-size: 14px;
    white-space: pre-wrap;
    color: var(--text);
  }

  .transcript-box {
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    color: var(--text);
    background: var(--surface);
    border-radius: 8px;
    padding: 16px;
    border: 1px solid var(--border);
  }

  .transcript-source {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 6px;
    font-style: italic;
  }

  .metadata-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
  }

  .meta-item {
    background: var(--surface);
    border-radius: 6px;
    padding: 10px 12px;
    border: 1px solid var(--border);
  }

  .meta-label {
    font-size: 11px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 2px;
  }

  .meta-value {
    font-size: 14px;
    font-weight: 500;
  }

  .load-more {
    padding: 14px;
    text-align: center;
  }

  .load-more button {
    padding: 8px 24px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
  }

  .load-more button:hover { border-color: var(--accent); }

  .no-transcript {
    color: var(--text-dim);
    font-style: italic;
    padding: 16px;
  }

  @media (max-width: 768px) {
    .layout { flex-direction: column; height: auto; }
    .list-panel { width: 100%; border-right: none; border-bottom: 1px solid var(--border); max-height: 40vh; }
    .detail-panel { padding: 20px 16px; }
  }
</style>
</head>
<body>

<header>
  <h1><span>TikTok</span> Prediction Market Transcripts</h1>
  <div class="controls">
    <input class="search-box" type="text" placeholder="Search transcripts, descriptions, usernames..." id="search">
    <button class="filter-btn" data-filter="has_transcript" id="btn-transcript">Has Transcript</button>
    <button class="filter-btn" data-filter="coded" id="btn-coded">Coded</button>
    <span class="stats" id="stats"></span>
  </div>
</header>

<div class="layout">
  <div class="list-panel" id="list-panel">
    <div id="video-list"></div>
    <div class="load-more" id="load-more" style="display:none;">
      <button onclick="loadMore()">Load more</button>
    </div>
  </div>
  <div class="detail-panel" id="detail-panel">
    <div class="detail-empty">Select a video to view its transcript</div>
  </div>
</div>

<script>
  let currentPage = 1;
  let totalResults = 0;
  let selectedId = null;
  let searchTimeout = null;
  const filters = { has_transcript: false, coded: false };

  const searchEl = document.getElementById('search');
  const listEl = document.getElementById('video-list');
  const detailEl = document.getElementById('detail-panel');
  const statsEl = document.getElementById('stats');
  const loadMoreEl = document.getElementById('load-more');

  function buildQuery(page) {
    const params = new URLSearchParams();
    params.set('page', page);
    params.set('per_page', 50);
    const q = searchEl.value.trim();
    if (q) params.set('q', q);
    if (filters.has_transcript) params.set('has_transcript', 'true');
    if (filters.coded) params.set('coded', 'true');
    return '/api/videos?' + params.toString();
  }

  async function loadVideos(append) {
    if (!append) {
      currentPage = 1;
      listEl.innerHTML = '';
    }
    const res = await fetch(buildQuery(currentPage));
    const data = await res.json();
    totalResults = data.total;
    statsEl.textContent = `${totalResults} videos`;

    for (const v of data.videos) {
      const card = document.createElement('div');
      card.className = 'video-card' + (v.post_id === selectedId ? ' selected' : '');
      card.dataset.id = v.post_id;

      const date = v.create_time ? new Date(v.create_time).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
      const plays = v.play_count ? Number(v.play_count).toLocaleString() : '—';
      const likes = v.digg_count ? Number(v.digg_count).toLocaleString() : '—';

      let tags = '';
      if (v.has_transcript) tags += `<span class="tag transcript">${v.transcript_source}</span>`;
      if (v.coded) tags += '<span class="tag coded">coded</span>';
      if (v.prediction_market) tags += `<span class="tag market">${v.prediction_market}</span>`;
      if (v.framing) tags += `<span class="tag">${v.framing}</span>`;

      card.innerHTML = `
        <div class="card-header">
          <span class="card-username">@${v.profile_username || 'unknown'}</span>
          <span class="card-date">${date}</span>
        </div>
        <div class="card-desc">${escapeHtml(v.description)}</div>
        <div class="card-tags">${tags}</div>
        <div class="card-stats">
          <span>▶ ${plays}</span>
          <span>♥ ${likes}</span>
        </div>
      `;
      card.addEventListener('click', () => selectVideo(v.post_id));
      listEl.appendChild(card);
    }

    loadMoreEl.style.display = (currentPage * data.per_page < totalResults) ? '' : 'none';
  }

  function loadMore() {
    currentPage++;
    loadVideos(true);
  }

  async function selectVideo(postId) {
    selectedId = postId;
    document.querySelectorAll('.video-card').forEach(c => {
      c.classList.toggle('selected', c.dataset.id === postId);
    });

    const res = await fetch(`/api/videos/${postId}`);
    const v = await res.json();

    const date = v.create_time ? new Date(v.create_time).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }) : '';

    let codedHtml = '';
    if (v.coded) {
      const fields = [
        ['Prediction Market', v.prediction_market],
        ['Framing', v.framing],
        ['Partisan Direction', v.partisan_direction],
        ['Candidate Referenced', v.candidate_referenced],
        ['Sentiment', v.sentiment],
      ].filter(([, val]) => val);

      if (fields.length) {
        codedHtml = `
          <div class="detail-section">
            <h3>Coded Fields</h3>
            <div class="metadata-grid">
              ${fields.map(([label, val]) => `
                <div class="meta-item">
                  <div class="meta-label">${label}</div>
                  <div class="meta-value">${escapeHtml(val)}</div>
                </div>
              `).join('')}
            </div>
          </div>`;
      }
    }

    const plays = v.play_count ? Number(v.play_count).toLocaleString() : '—';
    const likes = v.digg_count ? Number(v.digg_count).toLocaleString() : '—';
    const shares = v.share_count ? Number(v.share_count).toLocaleString() : '—';
    const comments = v.comment_count ? Number(v.comment_count).toLocaleString() : '—';
    const duration = v.video_duration ? `${Math.round(v.video_duration)}s` : '—';

    detailEl.innerHTML = `
      <div class="detail-header">
        <div class="detail-username">@${escapeHtml(v.profile_username || 'unknown')}</div>
        <div class="detail-date">${date} · ${duration}</div>
        ${v.url ? `<a class="detail-link" href="${escapeHtml(v.url)}" target="_blank" rel="noopener">Watch on TikTok ↗</a>` : ''}
      </div>

      <div class="detail-section">
        <h3>Engagement</h3>
        <div class="metadata-grid">
          <div class="meta-item"><div class="meta-label">Plays</div><div class="meta-value">${plays}</div></div>
          <div class="meta-item"><div class="meta-label">Likes</div><div class="meta-value">${likes}</div></div>
          <div class="meta-item"><div class="meta-label">Shares</div><div class="meta-value">${shares}</div></div>
          <div class="meta-item"><div class="meta-label">Comments</div><div class="meta-value">${comments}</div></div>
        </div>
      </div>

      <div class="detail-section">
        <h3>Description</h3>
        <div class="detail-description">${escapeHtml(v.description)}</div>
      </div>

      ${codedHtml}

      <div class="detail-section">
        <h3>Transcript</h3>
        ${v.transcript
          ? `<div class="transcript-box">${escapeHtml(v.transcript)}</div>
             <div class="transcript-source">Source: ${v.transcript_source === 'whisper' ? 'Whisper (AI-generated)' : 'TikTok auto-captions'}</div>`
          : '<div class="no-transcript">No transcript available for this video.</div>'}
      </div>
    `;
  }

  function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // Search with debounce
  searchEl.addEventListener('input', () => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => loadVideos(false), 300);
  });

  // Filter buttons
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.filter;
      filters[key] = !filters[key];
      btn.classList.toggle('active', filters[key]);
      loadVideos(false);
    });
  });

  // Initial load
  loadVideos(false);
</script>
</body>
</html>
